server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/algoverse}
spring.data.mongodb.auto-index-creation=true
spring.web.resources.static-locations=file:${FRONTEND_DIR:../}/
spring.web.resources.cache.period=0
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
algoverse.origin=${APP_ORIGIN:http://localhost:8080}
algoverse.secure-cookie=${SECURE_COOKIE:false}
algoverse.admin-email=${ADMIN_EMAIL:}
algoverse.admin-password=${ADMIN_PASSWORD:}
algoverse.judge-timeout-seconds=10
logging.level.org.mongodb.driver=WARN
